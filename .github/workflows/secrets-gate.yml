name: secrets-gate

# Reusable workflow: gitleaks over the commits of ONE pull request, with the
# estate's rules (planning #2928, part 2).
#
# Call it from a repository's own workflow, pinned to a commit SHA:
#
#   on:
#     pull_request:
#       branches: [main]
#   permissions:
#     contents: read
#   jobs:
#     secrets:
#       uses: neckarshore-ai/.github/.github/workflows/secrets-gate.yml@<40-char SHA>
#
# What it scans: the commits from the merge base to the head of the pull
# request. Never the history: a full-history scan was red on day one in two
# repositories (#2928, comment 6002222145), and a check that starts red gets
# switched off.
#
# Two steps, one job (one billed minute, not two):
#   1. Secrets and credential paths, config/gitleaks-estate.toml. A finding
#      fails the job.
#   2. Personal data, config/gitleaks-estate-pii.toml. A finding is reported in
#      the job summary and does NOT fail the job (Founder decision 2026-10-06).
#
# What comes from the pull request is treated as untrusted: nothing of it is
# executed, python runs isolated and outside the checkout, gitleaks' output is
# fenced against workflow commands, and file names are reduced to plain
# characters before they reach the summary. What a pull request CAN do, by
# design: silence a finding with `gitleaks:allow` or `.gitleaksignore`. That is
# visible in its diff and is the reviewer's to see.
#
# The pin must be a commit on `main` here: GitHub resolves a commit SHA of any
# fork of this repository under this repository's name. The job tests that and
# ends red otherwise. Read that test for what it is: it catches a MISTAKE (a
# pin on a branch, on an unmerged commit). It does not stop an attacker, because
# a workflow taken from a fork is the fork's file and simply does not contain
# the test. What stands against that is outside this file: the review of the
# pin in every caller pull request, and that the caller pins the SAME commit
# dev-environment compares its rules with (config/secrets-gate-public.pin there).
#
# The rule files are read from THIS repository at the commit the caller pinned
# (`job.workflow_sha`), so the pin covers the workflow and the rules together.
# Their source is neckarshore-ai/dev-environment; the files here are copies and
# dev-environment's CI goes red when they differ. Change the rules there.
#
# Runner: the caller repository's variable SECRETS_GATE_RUNS_ON, a JSON list
# such as ["self-hosted","review"]; hosted Linux when it is unset. On a runner
# that has gitleaks 8.30.1 the installed binary is used; otherwise the pinned
# release is downloaded and its checksum checked.
#
# Fail-closed: any event other than pull_request, an unknown workflow commit, a
# missing rule file, a checksum that does not match, a merge base that cannot
# be found, an empty range and any gitleaks exit other than 0 or 1 all end the
# job red with a line that says which.
#
# False positive in one repository: `gitleaks:allow` on the line, or the
# finding's fingerprint in that repository's `.gitleaksignore`.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: secrets-gate
    runs-on: ${{ fromJSON(vars.SECRETS_GATE_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"
      EVENT_NAME: ${{ github.event_name }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RULES_REPOSITORY: ${{ job.workflow_repository }}
      RULES_SHA: ${{ job.workflow_sha }}
    steps:
      - name: Refuse what cannot be scanned
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::secrets-gate: $1"; exit 1; }
          [ "$EVENT_NAME" = "pull_request" ] \
            || fail "event is '$EVENT_NAME'; this workflow scans a pull request's commits and nothing else."
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "no base commit in the event."
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "no head commit in the event."
          [[ "$RULES_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || fail "the commit of this workflow is unknown (job.workflow_sha is '$RULES_SHA'); the rule files cannot be pinned."
          [ -n "$RULES_REPOSITORY" ] || fail "the repository of this workflow is unknown."
          echo "rules: $RULES_REPOSITORY@$RULES_SHA"
          echo "range: merge base of $BASE_SHA and $HEAD_SHA .. $HEAD_SHA"

      - name: Checkout the pull request head (with history, for the merge base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: repo

      # No checkout action here on purpose. GitHub resolves a commit of ANY fork
      # of this public repository under this repository's name, in `uses:` and
      # in a checkout by SHA alike. So main is cloned, and nothing else of the
      # remote; a pin that is not an ancestor of main ends the job red before a
      # single rule is read.
      - name: The pinned commit must be on main of the rules repository
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::secrets-gate: $1"; exit 1; }
          [[ "$RULES_REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] \
            || fail "the repository of this workflow has an unexpected name."
          GIT_TERMINAL_PROMPT=0 git clone --quiet --no-checkout --single-branch --branch main \
            "https://github.com/$RULES_REPOSITORY.git" "$GITHUB_WORKSPACE/rules" \
            || fail "cannot clone main of $RULES_REPOSITORY."
          cd "$GITHUB_WORKSPACE/rules"
          git cat-file -e "$RULES_SHA^{commit}" 2>/dev/null \
            || fail "the pinned commit $RULES_SHA is not on main of $RULES_REPOSITORY (a branch, or a commit of a fork). Pin a commit of main."
          git merge-base --is-ancestor "$RULES_SHA" refs/remotes/origin/main \
            || fail "the pinned commit $RULES_SHA is not an ancestor of main of $RULES_REPOSITORY. Pin a commit of main."
          git -c advice.detachedHead=false checkout --quiet --detach "$RULES_SHA"
          echo "rules: $RULES_REPOSITORY@$RULES_SHA, on main"

      - name: gitleaks (installed, or the pinned release with its checksum)
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::secrets-gate: $1"; exit 1; }
          want="$GITLEAKS_VERSION"
          bin=""
          for c in /opt/homebrew/bin/gitleaks /usr/local/bin/gitleaks "$(command -v gitleaks || true)"; do
            [ -n "$c" ] && [ -x "$c" ] || continue
            if [ "$("$c" version 2>/dev/null | tr -d 'v[:space:]')" = "$want" ]; then bin="$c"; break; fi
          done
          if [ -z "$bin" ]; then
            case "$(uname -s)-$(uname -m)" in
              Linux-x86_64)  asset="linux_x64";    sum="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" ;;
              Linux-aarch64) asset="linux_arm64";  sum="e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080" ;;
              Darwin-arm64)  asset="darwin_arm64"; sum="b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5" ;;
              *) fail "no pinned gitleaks $want for $(uname -s)-$(uname -m), and none installed." ;;
            esac
            dir="$RUNNER_TEMP/gitleaks-$want"
            mkdir -p "$dir"
            curl -fsSL --retry 3 \
              "https://github.com/gitleaks/gitleaks/releases/download/v${want}/gitleaks_${want}_${asset}.tar.gz" \
              -o "$dir/gitleaks.tar.gz"
            got="$( (sha256sum "$dir/gitleaks.tar.gz" 2>/dev/null || shasum -a 256 "$dir/gitleaks.tar.gz") | cut -d' ' -f1)"
            [ "$got" = "$sum" ] || fail "checksum of the gitleaks download does not match (got $got)."
            tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
            chmod +x "$dir/gitleaks"
            bin="$dir/gitleaks"
          fi
          [ "$("$bin" version | tr -d 'v[:space:]')" = "$want" ] || fail "gitleaks at $bin is not $want."
          echo "gitleaks: $bin ($want)"
          echo "GITLEAKS_BIN=$bin" >> "$GITHUB_ENV"

      - name: Work out the range
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          fail() { echo "::error::secrets-gate: $1"; exit 1; }
          for f in config/gitleaks-estate.toml config/gitleaks-estate-pii.toml; do
            [ -s "$GITHUB_WORKSPACE/rules/$f" ] || fail "rule file $f is missing at $RULES_REPOSITORY@$RULES_SHA."
          done
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
            || git fetch --no-tags --quiet origin "$BASE_SHA" \
            || fail "the base commit $BASE_SHA is not in the checkout and cannot be fetched."
          mb="$(git merge-base "$BASE_SHA" "$HEAD_SHA")" || fail "no merge base of $BASE_SHA and $HEAD_SHA."
          n="$(git rev-list --count "$mb..$HEAD_SHA")"
          [ "$n" -gt 0 ] || fail "the range $mb..$HEAD_SHA holds no commit; nothing would be scanned."
          echo "scanning $n commit(s): $mb..$HEAD_SHA"
          echo "RANGE=$mb..$HEAD_SHA" >> "$GITHUB_ENV"
          echo "RANGE_COMMITS=$n" >> "$GITHUB_ENV"

      - name: Secrets and credential paths (a finding fails the job)
        shell: bash
        working-directory: repo
        run: |
          set -uo pipefail
          # File names and commit data in gitleaks' output come from the pull
          # request. Nothing printed between the two fence lines is read as a
          # workflow command.
          fence="sg-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$fence"
          # --text: a binary file (.p12, .key) has no diff otherwise, and a
          # path rule would never see it.
          "$GITLEAKS_BIN" git . \
            --config "$GITHUB_WORKSPACE/rules/config/gitleaks-estate.toml" \
            --log-opts="--text $RANGE" \
            --redact --no-banner --verbose --exit-code 1
          rc=$?
          echo "::$fence::"
          case "$rc" in
            0) echo "secrets-gate: no finding in $RANGE_COMMITS commit(s)." ;;
            1) echo "::error::secrets-gate: finding(s) in $RANGE. Remove the value from the commits (a later commit that deletes it does not help: every commit of the pull request is scanned). False positive: 'gitleaks:allow' on the line, or the fingerprint above in .gitleaksignore."
               exit 1 ;;
            *) echo "::error::secrets-gate: gitleaks ended with $rc; the scan did not run to its end."
               exit 1 ;;
          esac

      - name: Personal data (reported, does not fail the job)
        if: ${{ !cancelled() && env.RANGE != '' }}
        shell: bash
        working-directory: repo
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/secrets-gate-pii.json"
          "$GITLEAKS_BIN" git . \
            --config "$GITHUB_WORKSPACE/rules/config/gitleaks-estate-pii.toml" \
            --log-opts="$RANGE" \
            --redact --no-banner --exit-code 1 \
            --report-format json --report-path "$report" >/dev/null 2>&1
          rc=$?
          # From here on nothing runs inside the checkout: python would import a
          # json.py planted in the pull request from its working directory.
          cd "$RUNNER_TEMP"
          {
            echo "### Personal data in the pull request's commits"
            echo
            case "$rc" in
              0) echo "No finding in $RANGE_COMMITS commit(s)." ;;
              1) echo "Finding(s), values redacted. This step does not fail the job."
                 echo
                 echo "| Rule | File | Line | Commit |"
                 echo "|---|---|---|---|"
                 python3 -I - "$report" <<'PY' || echo "| (the report could not be read) | | | |"
          import json, re, sys
          def cell(v, n):
              # File names come from the pull request: keep letters, digits and a
              # few path characters, so nothing becomes markdown, HTML or a new row.
              return re.sub(r"[^A-Za-z0-9._/ +@-]", "?", str(v))[:n]
          for f in json.load(open(sys.argv[1])):
              print("| %s | %s | %s | %s |" % (cell(f.get("RuleID"), 60), cell(f.get("File"), 200),
                                               cell(f.get("StartLine"), 8), cell(f.get("Commit"), 7)))
          PY
                 ;;
              *) echo "gitleaks ended with $rc; the personal-data scan did not run to its end." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          case "$rc" in
            0) : ;;
            1) echo "::warning::secrets-gate: personal data reported, see the job summary." ;;
            *) echo "::warning::secrets-gate: the personal-data scan ended with $rc and reported nothing." ;;
          esac
          exit 0
