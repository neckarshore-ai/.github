name: secrets-gate-self

# This repository runs its own gate on every pull request to main, the same
# way any caller does (planning #2928; MASCHIN's condition of 2026-10-09:
# main here requires the workflow's own run before the first caller pins).
# Until this file, a pull request here could be merged with no run at all.
#
# It calls the gate BY PIN, not as ./.github/workflows/secrets-gate.yml: a
# local call runs at the pull request's commit, which is not on main, and the
# gate's own pin test ends that red by design.
#
# What this check therefore is, and is not:
#   - it scans the pull request's commits with the rules of the PINNED commit,
#     exactly as a caller's pull request is scanned;
#   - it does NOT test a changed secrets-gate.yml, rule file or matcher in the
#     same pull request. Those run here only after merge, when the pin below
#     is moved to the new commit of main.
#
# The pin is the same commit dev-environment compares its rules with
# (config/secrets-gate-public.pin there). Move both together.
# Public repository, no SECRETS_GATE_RUNS_ON variable: hosted Linux, free.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    uses: neckarshore-ai/.github/.github/workflows/secrets-gate.yml@794d1defb4cd4ec3851cf081dcd70e02aa4a93af
